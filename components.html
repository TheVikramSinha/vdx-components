<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>VDX Component Library — Class Inventory</title>
<style>
  :root{
    --bg:#f6f7f9;
    --surface:#ffffff;
    --border:#e6e8ee;
    --text:#161b26;
    --text-2:#5b6478;
    --text-3:#8b93a5;
    --accent:#4f46e5;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  }

  *,*::before,*::after{ box-sizing:border-box; }

  html{ scroll-behavior:smooth; }

  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    font-size:15px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }

  /* ---------- shell ---------- */
  .wrap{
    display:grid;
    grid-template-columns:252px minmax(0,1fr);
    align-items:start;
  }

  /* ---------- sidebar ---------- */
  .sidebar{
    position:sticky;
    top:0;
    height:100vh;
    overflow-y:auto;
    background:var(--surface);
    border-right:1px solid var(--border);
    padding:20px 12px 40px;
    scrollbar-width:thin;
  }

  .brand{
    display:flex;
    align-items:center;
    gap:10px;
    padding:0 8px 18px;
  }
  .brand__mark{
    width:32px;height:32px;flex:0 0 32px;
    border-radius:9px;
    background:linear-gradient(135deg,#4f46e5,#7c3aed);
    color:#fff;
    display:grid;place-items:center;
    font-weight:700;font-size:12px;letter-spacing:.4px;
  }
  .brand__name{ font-weight:650;font-size:14px;letter-spacing:-.01em;line-height:1.25; }
  .brand__sub{ font-size:11.5px;color:var(--text-3); }

  .nav{ display:flex;flex-direction:column;gap:1px; }
  .nav a{
    display:flex;align-items:center;justify-content:space-between;gap:8px;
    padding:6px 10px;
    border-radius:8px;
    color:var(--text-2);
    text-decoration:none;
    font-size:13.5px;
    transition:background .12s, color .12s;
  }
  .nav a:hover{ background:#f2f4f8;color:var(--text); }
  .nav a.is-active{ background:#eef0ff;color:#4338ca;font-weight:600; }
  .nav .count{
    font-size:11px;color:var(--text-3);
    font-variant-numeric:tabular-nums;
    background:#f2f4f8;
    padding:1px 6px;
    border-radius:20px;
  }
  .nav a.is-active .count{ background:#e0e3ff;color:#4f46e5; }

  /* ---------- topbar ---------- */
  .topbar{
    position:sticky;
    top:0;
    z-index:20;
    display:flex;
    align-items:center;
    gap:20px;
    flex-wrap:wrap;
    padding:13px 34px;
    background:rgba(246,247,249,.88);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    border-bottom:1px solid var(--border);
  }

  .search{ position:relative;flex:1 1 240px;max-width:400px; }
  .search svg{
    position:absolute;left:11px;top:50%;transform:translateY(-50%);
    color:var(--text-3);pointer-events:none;
  }
  .search input{
    width:100%;
    padding:9px 12px 9px 34px;
    border:1px solid #dfe3ea;
    border-radius:9px;
    background:#fff;
    font:inherit;
    font-size:13.5px;
    color:inherit;
    outline:none;
    transition:border-color .12s, box-shadow .12s;
  }
  .search input::placeholder{ color:#a3abbb; }
  .search input:focus{
    border-color:#a5b4fc;
    box-shadow:0 0 0 3px rgba(99,102,241,.14);
  }

  .legend{
    display:flex;gap:14px;flex-wrap:wrap;
    font-size:12px;color:var(--text-2);
  }
  .legend span{ display:inline-flex;align-items:center;gap:6px; }
  .dot{ width:8px;height:8px;border-radius:50%;display:inline-block; }

  .total{
    margin-left:auto;
    font-size:12.5px;
    color:var(--text-3);
    white-space:nowrap;
  }
  .total strong{
    color:var(--text);
    font-variant-numeric:tabular-nums;
    font-weight:650;
  }

  /* ---------- content ---------- */
  .sections{
    padding:26px 34px 90px;
    display:flex;
    flex-direction:column;
    gap:22px;
  }

  .section{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:14px;
    padding:19px 22px 21px;
    scroll-margin-top:88px;
  }

  .section__head{
    display:flex;align-items:center;gap:9px;flex-wrap:wrap;
    margin-bottom:3px;
  }
  .section__title{
    margin:0;
    font-size:15.5px;
    font-weight:650;
    letter-spacing:-.01em;
  }
  .section__count{
    font-size:11px;
    font-weight:650;
    color:var(--text-3);
    background:#f2f4f8;
    padding:2px 8px;
    border-radius:20px;
    font-variant-numeric:tabular-nums;
  }
  .section__desc{
    margin:0 0 15px;
    font-size:13px;
    color:var(--text-2);
  }

  .pills{
    display:flex;
    flex-wrap:wrap;
    gap:7px;
  }

  .pill{
    font-family:var(--mono);
    font-size:12.5px;
    line-height:1.45;
    padding:4px 9px;
    border-radius:7px;
    border:1px solid transparent;
    cursor:pointer;
    user-select:none;
    white-space:nowrap;
    transition:transform .08s ease, box-shadow .12s ease, background .12s;
  }
  .pill:hover{ transform:translateY(-1px); box-shadow:0 2px 8px rgba(16,24,40,.10); }
  .pill:active{ transform:translateY(0); }
  .pill:focus-visible{ outline:2px solid #a5b4fc;outline-offset:1px; }

  .pill--base{     background:#f1f3f7; color:#334155; border-color:#e4e8ef; }
  .pill--element{  background:#eef4ff; color:#1d4ed8; border-color:#dbe6fe; }
  .pill--modifier{ background:#f6f1ff; color:#7c3aed; border-color:#e9defd; }
  .pill--tag{      background:#ecfdf5; color:#047857; border-color:#d1fae5; }

  .no-results{
    display:none;
    text-align:center;
    padding:70px 20px;
    color:var(--text-3);
    font-size:14px;
  }
  .no-results strong{ color:var(--text-2); }

  /* ---------- copy toast ---------- */
  .toast{
    position:fixed;
    left:50%;
    bottom:28px;
    transform:translateX(-50%) translateY(14px);
    background:#111827;
    color:#fff;
    font-size:13px;
    padding:9px 16px;
    border-radius:9px;
    box-shadow:0 10px 30px rgba(16,24,40,.24);
    opacity:0;
    pointer-events:none;
    transition:opacity .18s ease, transform .18s ease;
    z-index:100;
    font-family:var(--mono);
    font-size:12.5px;
    max-width:90vw;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .toast.is-visible{ opacity:1; transform:translateX(-50%) translateY(0); }

  /* ---------- responsive ---------- */
  @media (max-width:900px){
    .wrap{ grid-template-columns:1fr; }
    .sidebar{
      position:static;
      height:auto;
      display:flex;
      align-items:center;
      gap:14px;
      padding:12px 16px;
      overflow-x:auto;
      border-right:none;
      border-bottom:1px solid var(--border);
      scrollbar-width:none;
    }
    .sidebar::-webkit-scrollbar{ display:none; }
    .brand{ padding:0;flex-shrink:0; }
    .brand__sub{ display:none; }
    .nav{ flex-direction:row;gap:6px; }
    .nav a{ white-space:nowrap;background:#f2f4f8;padding:6px 10px; }
    .nav .count{ display:none; }
    .topbar{ padding:12px 16px;gap:12px; }
    .legend{ display:none; }
    .total{ margin-left:0; }
    .sections{ padding:18px 16px 70px;gap:16px; }
    .section{ padding:16px 16px 18px;border-radius:12px;scroll-margin-top:130px; }
  }
</style>
</head>
<body>

<div class="wrap">

  <!-- ============ SIDEBAR ============ -->
  <aside class="sidebar">
    <div class="brand">
      <div class="brand__mark">VDX</div>
      <div>
        <div class="brand__name">Component Library</div>
        <div class="brand__sub">Class inventory</div>
      </div>
    </div>
    <nav class="nav" id="nav"></nav>
  </aside>

  <!-- ============ MAIN ============ -->
  <main>
    <header class="topbar">
      <div class="search">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>
        </svg>
        <input id="search" type="search" placeholder="Search classes…  e.g. btn, modal, --active" autocomplete="off" spellcheck="false" aria-label="Search classes" />
      </div>

      <div class="legend">
        <span><i class="dot" style="background:#94a3b8"></i>base</span>
        <span><i class="dot" style="background:#3b82f6"></i>element</span>
        <span><i class="dot" style="background:#8b5cf6"></i>modifier</span>
        <span><i class="dot" style="background:#10b981"></i>tag</span>
      </div>

      <div class="total"><strong id="total">0</strong> classes</div>
    </header>

    <div class="sections" id="sections"></div>
    <div class="no-results" id="noResults">No classes match <strong id="noResultsTerm"></strong></div>
  </main>

</div>

<div class="toast" id="toast"></div>

/* ------------------------------------------------------------------
   Helpers
   ------------------------------------------------------------------ */
function typeOf(name){
  if(!name.startsWith('.')) return 'tag';
  const n = name.slice(1);
  if(n.includes('--')) return 'modifier';
  if(n.includes('__')) return 'element';
  return 'base';
}

function labelOf(name){
  return name.startsWith('.') ? name : '<' + name + '>';
}

const navEl      = document.getElementById('nav');
const sectionsEl = document.getElementById('sections');
const totalEl    = document.getElementById('total');
const searchEl   = document.getElementById('search');
const noResults  = document.getElementById('noResults');
const noTerm     = document.getElementById('noResultsTerm');
const toastEl    = document.getElementById('toast');

/* ------------------------------------------------------------------
   Render
   ------------------------------------------------------------------ */
const GRAND_TOTAL = SECTIONS.reduce((sum, s) => sum + s.classes.length, 0);
totalEl.textContent = GRAND_TOTAL;

SECTIONS.forEach(sec => {
  /* nav link */
  const a = document.createElement('a');
  a.href = '#' + sec.id;
  a.dataset.target = sec.id;
  a.innerHTML = '<span>' + sec.title + '</span><span class="count">' + sec.classes.length + '</span>';
  navEl.appendChild(a);

  /* section */
  const section = document.createElement('section');
  section.className = 'section';
  section.id = sec.id;

  const head = document.createElement('div');
  head.className = 'section__head';
  head.innerHTML =
    '<h2 class="section__title"></h2>' +
    '<span class="section__count">' + sec.classes.length + '</span>';
  head.querySelector('.section__title').textContent = sec.title;

  const desc = document.createElement('p');
  desc.className = 'section__desc';
  desc.textContent = sec.desc;

  const pills = document.createElement('div');
  pills.className = 'pills';

  sec.classes.forEach(cls => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'pill pill--' + typeOf(cls);
    btn.dataset.name = cls;
    btn.textContent = labelOf(cls);
    btn.title = 'Click to copy  ' + labelOf(cls);
    pills.appendChild(btn);
  });

  section.append(head, desc, pills);
  sectionsEl.appendChild(section);
});

/* ------------------------------------------------------------------
   Copy to clipboard
   ------------------------------------------------------------------ */
let toastTimer;
sectionsEl.addEventListener('click', e => {
  const pill = e.target.closest('.pill');
  if(!pill) return;
  const text = pill.dataset.name;

  const done = () => {
    toastEl.textContent = 'Copied  ' + text;
    toastEl.classList.add('is-visible');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('is-visible'), 1400);
  };

  if(navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(text).then(done).catch(done);
  } else {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); } catch(_) {}
    document.body.removeChild(ta);
    done();
  }
});

/* ------------------------------------------------------------------
   Search / filter
   ------------------------------------------------------------------ */
function applyFilter(raw){
  const q = raw.trim().toLowerCase();
  let visibleTotal = 0;

  SECTIONS.forEach(sec => {
    const sectionEl = document.getElementById(sec.id);
    const navLink   = navEl.querySelector('[data-target="' + sec.id + '"]');
    const countEl   = sectionEl.querySelector('.section__count');
    const navCount  = navLink.querySelector('.count');

    const titleMatch = !q || sec.title.toLowerCase().includes(q) || sec.id.includes(q);
    let visible = 0;

    sectionEl.querySelectorAll('.pill').forEach(pill => {
      const match = !q || titleMatch || pill.dataset.name.toLowerCase().includes(q);
      pill.style.display = match ? '' : 'none';
      if(match) visible++;
    });

    sectionEl.style.display = visible ? '' : 'none';
    navLink.style.display   = visible ? '' : 'none';
    countEl.textContent     = visible;
    navCount.textContent    = visible;

    visibleTotal += visible;
  });

  totalEl.textContent = visibleTotal;
  noTerm.textContent = '"' + raw.trim() + '"';
  noResults.style.display = visibleTotal ? 'none' : 'block';
}

searchEl.addEventListener('input', e => applyFilter(e.target.value));

/* ------------------------------------------------------------------
   Scroll spy
   ------------------------------------------------------------------ */
const navLinks = [...navEl.querySelectorAll('a')];
const observer = new IntersectionObserver(entries => {
  entries.forEach(entry => {
    if(entry.isIntersecting){
      navLinks.forEach(l => l.classList.toggle('is-active', l.dataset.target === entry.target.id));
    }
  });
}, { rootMargin: '-85px 0px -70% 0px', threshold: 0 });

document.querySelectorAll('.section').forEach(s => observer.observe(s));
</script>
